<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="assets/styles.css" />
    <title>Lerncheck – Lehrer Login</title>
</head>
<body>
<header>
    <a href="index.html"><strong>Lerncheck</strong></a>
    <small>Lehrerbereich</small>
</header>

<main class="grid grid-2">
    <section class="card">
        <h2>Login</h2>
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="lehrer@schule.de" />
        <label>Passwort</label>
        <input id="loginPw" type="password" placeholder="••••••••" />
        <div class="row">
            <button id="btnLogin">Login</button>
            <a href="teacher-dashboard.html" class="badge">Dashboard</a>
        </div>
        <div id="loginMsg" class="msg"></div>
    </section>

    <section class="card">
        <h2>Registrierung</h2>
        <label>Email</label>
        <input id="regEmail" type="email" placeholder="lehrer@schule.de" />
        <label>Name</label>
        <input id="regName" type="text" placeholder="Max Mustermann" />
        <label>Passwort</label>
        <input id="regPw" type="password" placeholder="••••••••" />
        <div class="row">
            <button id="btnRegister">Registrieren</button>
        </div>
        <div id="regMsg" class="msg"></div>
    </section>
</main>

<script type="module" src="js/teacher.js"></script>
</body>
</html>
