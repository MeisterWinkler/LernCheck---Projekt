<!-- Summary: Schüler-Quiz: Fragen anzeigen, Antworten wählen, abgeben, Ergebnis + adaptive Wiederholung. -->
<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="assets/styles.css" />
    <title>Lerncheck – Quiz</title>
</head>
<body>
<header>
    <a href="index.html"><strong>Lerncheck</strong></a>
    <div class="row">
        <small id="quizTitle">Quiz</small>
        <a href="student-join.html" class="badge">PIN eingeben</a>
    </div>
</header>

<main>
    <section class="card">
        <h2>Fragen</h2>
        <div id="quizMsg" class="msg"></div>
        <div id="questionsWrap"></div>
        <div class="row">
            <button id="btnSubmit">Abgeben</button>
            <button id="btnLoadRepeat" class="secondary">Wiederholen (adaptiv)</button>
        </div>
    </section>

    <section class="card">
        <h2>Ergebnis</h2>
        <div id="resultWrap"></div>
    </section>
</main>

<script type="module" src="js/student.js"></script>
</body>
</html>
