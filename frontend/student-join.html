<!-- Summary: Schüler tritt per PIN anonym bei und wird zur Quizseite weitergeleitet. -->
<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="assets/styles.css" />
    <title>Lerncheck – Schüler Join</title>
</head>
<body>
<header>
    <a href="index.html"><strong>Lerncheck</strong></a>
    <small>Schülerbereich</small>
</header>

<main>
    <section class="card">
        <h2>Quiz beitreten</h2>
        <p>Gib die PIN ein (oder später via QR-Code).</p>

        <label>PIN</label>
        <input id="pin" placeholder="z.B. 123456" />
        <div class="row">
            <button id="btnJoin">Beitreten</button>
            <a href="student-quiz.html" class="badge">Quiz</a>
        </div>

        <div id="joinMsg" class="msg"></div>
    </section>
</main>

<script type="module" src="js/student.js"></script>
</body>
</html>
