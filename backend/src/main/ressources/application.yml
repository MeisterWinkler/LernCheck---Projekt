# Summary: Konfiguration (H2 dev DB, JWT, CORS).
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:lerncheck;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_VALUE_32CHARS_MIN"
    issuer: "lerncheck"
    ttlMinutes: 480

cors:
  allowedOrigins:
    - "http://localhost:5500"
    - "http://127.0.0.1:5500"