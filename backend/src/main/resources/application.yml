# Summary: Basis-Konfiguration (H2 + JWT).
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:lerncheck;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

app:
  jwt:
    # mind. 32 Zeichen, sonst wirft JJWT später ggf. wieder Fehler
    secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_VALUE_32CHARS_MINIMUM"
    issuer: "lerncheck"
    ttlMinutes: 480