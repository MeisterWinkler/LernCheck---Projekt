<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Ergebnis</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="topbar">
    <h1>Ergebnis</h1>
    <a class="badge" href="/student/join.html">Neues Quiz</a>
</div>

<div class="card wide">
    <div id="wrap"></div>
</div>

<script type="module">
    import { nav } from "/assets/common.js";

    const res = JSON.parse(localStorage.getItem("lastResult") || "null");
    if(!res) nav("/student/join.html");

    const reason = localStorage.getItem("finishReason") || "manual";

    wrap.innerHTML = `
      <p class="small">Abgabe: <b>${reason === "timeout" ? "Timer abgelaufen (Auto-Submit)" : "manuell"}</b></p>
      <p><b>Fragen insgesamt:</b> ${res.totalQuestions}</p>
      <p><b>Beantwortet:</b> ${res.answered}</p>
      <p><b>Richtig:</b> ${res.correct}</p>
    `;
</script>
</body>
</html>
