<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Quiz beitreten</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="topbar">
    <h1>Schüler – Quiz beitreten</h1>
    <a class="badge" href="/teacher/login.html">Lehrerbereich</a>
</div>

<div class="card wide">
    <label>Einladungscode (PIN)</label>
    <input id="pin" placeholder="z.B. 123456">
    <div class="row" style="margin-top:12px;">
        <button class="btn primary" id="joinBtn">Beitreten</button>
    </div>
    <div class="msg small" id="msg"></div>
</div>

<script type="module">
    import { api, nav } from "/assets/common.js";

    joinBtn.onclick = async () => {
      msg.textContent = "";
      try{
        const res = await api("/api/student/join", {
          method:"POST",
          body: JSON.stringify({ pin: pin.value })
        });
        localStorage.setItem("anonToken", res.anonToken);
        localStorage.setItem("runId", String(res.runId));
        localStorage.setItem("endsAt", res.endsAt);
        nav("/student/quiz.html");
      } catch(e){ msg.textContent = e.message; }
    };
</script>
</body>
</html>
