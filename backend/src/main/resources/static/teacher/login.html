<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Lehrer Login</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="topbar">
    <h1>Lehrer Login</h1>
    <a class="badge" href="/student/join.html">Schülerbereich</a>
</div>

<div class="row">
    <div class="card">
        <h2>Login</h2>
        <label>Benutzername</label>
        <input id="luser" placeholder="z.B. maxmustermann">
        <label>Passwort</label>
        <input id="lpass" type="password" placeholder="••••••••">
        <div class="row" style="margin-top:12px;">
            <button class="btn primary" id="loginBtn">Login</button>
        </div>
        <div class="msg small" id="lmsg"></div>
    </div>

    <div class="card">
        <h2>Registrieren</h2>
        <label>Benutzername</label>
        <input id="ruser" placeholder="z.B. maxmustermann">
        <label>Anzeigename</label>
        <input id="rname" placeholder="Max Mustermann">
        <label>Passwort</label>
        <input id="rpass" type="password" placeholder="••••••••">
        <div class="row" style="margin-top:12px;">
            <button class="btn" id="regBtn">Registrieren</button>
        </div>
        <div class="msg small" id="rmsg"></div>
    </div>
</div>

<script type="module">
    import { api, setToken, nav } from "/assets/common.js";

    loginBtn.onclick = async () => {
      lmsg.textContent = "";
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ username: luser.value, password: lpass.value })
        });
        setToken(data.token);
        nav("/teacher/dashboard.html");
      } catch(e) { lmsg.textContent = e.message; }
    };

    regBtn.onclick = async () => {
      rmsg.textContent = "";
      try {
        const data = await api("/api/auth/register", {
          method: "POST",
          body: JSON.stringify({ username: ruser.value, displayName: rname.value, password: rpass.value })
        });
        setToken(data.token);
        nav("/teacher/dashboard.html");
      } catch(e) { rmsg.textContent = e.message; }
    };
</script>
</body>
</html>
