<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Klasse</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="topbar">
    <h1 id="title">Klasse</h1>
    <div class="row">
        <a class="badge" href="/teacher/dashboard.html">Zurück</a>
    </div>
</div>

<div class="card wide">
    <h2>QuizRuns dieser Klasse</h2>
    <p class="small">Ein Run ist eine konkrete Durchführung eines Templates (mit Start/PIN/Timer).</p>
    <div class="msg small" id="msg"></div>
</div>

<hr>

<div class="row" id="runs"></div>

<script type="module">
    import { api, qs, nav, requireTeacherAuth } from "/assets/common.js";
    if(!requireTeacherAuth()) {}

    const classId = Number(qs("classId"));

    async function load() {
      runs.innerHTML = "";
      const list = await api(`/api/teacher/classes/${classId}/runs`);
      title.textContent = `Klasse ${classId}`;

      for (const r of list) {
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <h3>${r.title}</h3>
          <p class="small">RunID: ${r.id}</p>
          <p class="small">Status: <b>${r.status}</b></p>
          <p class="small">PIN: ${r.joinPin ?? "-"}</p>
          <button class="btn primary">Öffnen</button>
        `;
        el.querySelector("button").onclick = () => nav(`/teacher/run.html?runId=${r.id}`);
        runs.appendChild(el);
      }
    }

    load().catch(e => msg.textContent = e.message);
</script>
</body>
</html>
