# Summary: Basis-Konfiguration (MariaDB + JPA + JWT).

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/lerncheck
    username: root
    password: ""
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  # verhindert, dass Spring automatisch SQL-Skripte wie schema.sql/data.sql ausführt
  sql:
    init:
      mode: never

app:
  jwt:
    # mind. 32 Zeichen, sonst wirft JJWT später ggf. wieder Fehler
    secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_VALUE_32CHARS_MINIMUM"
    issuer: "lerncheck"
    ttlMinutes: 480