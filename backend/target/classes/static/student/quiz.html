<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Quiz</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="topbar">
    <h1 id="title">Quiz</h1>
    <div class="timer">⏱ <span id="t">--:--</span></div>
</div>

<div class="card wide">
    <div id="wrap"></div>

    <hr>

    <h3>Optionales Feedback</h3>
    <textarea id="fb" placeholder="Optional: Was war gut/schlecht?"></textarea>

    <div class="row" style="margin-top:12px;">
        <button class="btn primary" id="submitBtn">Abschicken</button>
    </div>

    <div class="msg small" id="msg"></div>
</div>

<script type="module">
    import { api, nav } from "/assets/common.js";

    const runId = Number(localStorage.getItem("runId"));
    const anonToken = localStorage.getItem("anonToken");

    if(!runId || !anonToken) nav("/student/join.html");

    let quiz = null;
    const chosen = new Map(); // tqId -> "A/B/C/D"

    function render() {
      wrap.innerHTML = "";
      for(const q of quiz.questions) {
        const el = document.createElement("div");
        el.className = "card wide";
        el.style.margin = "10px 0";
        el.innerHTML = `
          <h3>Frage ${q.pos}</h3>
          <div>${escapeHtml(q.text)}</div>
          ${opt(q.id,"A",q.optionA)}
          ${opt(q.id,"B",q.optionB)}
          ${opt(q.id,"C",q.optionC)}
          ${opt(q.id,"D",q.optionD)}
        `;
        wrap.appendChild(el);
      }

      wrap.querySelectorAll("input[type=radio]").forEach(r => {
        r.addEventListener("change", () => {
          const id = Number(r.dataset.qid);
          chosen.set(id, r.value);
        });
      });
    }

    function opt(qid, v, label) {
      return `
        <label class="row" style="margin:6px 0;">
          <input data-qid="${qid}" type="radio" name="q_${qid}" value="${v}">
          <span>${v}: ${escapeHtml(label)}</span>
        </label>
      `;
    }

    function escapeHtml(s){ return (s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }

    async function finalizeSubmit(reason) {
      msg.textContent = "";
      try{
        // letzter Stand (auch wenn nicht alles beantwortet)
        const answers = [];
        for(const [templateQuestionId, chosenOption] of chosen.entries()) {
          answers.push({ templateQuestionId, chosenOption });
        }

        const res = await api("/api/student/submit", {
          method:"POST",
          body: JSON.stringify({
            anonToken,
            answers,
            feedback: fb.value,
            finalizeAttempt: true
          })
        });

        localStorage.setItem("lastResult", JSON.stringify(res));
        localStorage.setItem("finishReason", reason);
        nav("/student/result.html");
      } catch(e) {
        msg.textContent = e.message;
      }
    }

    submitBtn.onclick = () => finalizeSubmit("manual");

    // Timer: basiert auf endsAt vom Server
    function startTimer(endsAt) {
      function tick() {
        const now = Date.now();
        const diff = Math.max(0, Math.floor((endsAt - now)/1000));
        const m = String(Math.floor(diff/60)).padStart(2,"0");
        const s = String(diff%60).padStart(2,"0");
        t.textContent = `${m}:${s}`;
        if(diff <= 0) finalizeSubmit("timeout");
        else setTimeout(tick, 1000);
      }
      tick();
    }

    (async () => {
      quiz = await api(`/api/student/run/${runId}`);
      title.textContent = quiz.title;

      render();

      // endsAt kommt vom API (Instant → JSON String)
      const ends = new Date(quiz.endsAt).getTime();
      startTimer(ends);
    })();
</script>
</body>
</html>
